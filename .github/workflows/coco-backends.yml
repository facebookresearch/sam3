name: COCO evaluation backends

on:
  pull_request:
    paths:
      - "sam3/eval/**"
      - "sam3/train/masks_ops.py"
      - "sam3/train/utils/distributed.py"
      - "tests/test_coco_backends.py"
      - "pyproject.toml"
      - ".github/workflows/coco-backends.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAYON_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install PyTorch CPU builds
        run: python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install evaluator and package import dependencies
        run: python -m pip install -e ".[ultrafast]" pytest scipy einops psutil triton==3.6.0 "setuptools<81"
      - name: Test online and offline evaluation, including distributed transport
        run: python -m pytest -v tests/test_coco_backends.py
